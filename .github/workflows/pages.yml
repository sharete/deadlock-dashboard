name: Deploy Deadlock Dashboard to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Statische Ausgabe prüfen
        run: npm test

      - name: Persönliche Deadlock-Daten aktualisieren
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID64: ${{ secrets.STEAM_ID64 || vars.STEAM_ID64 }}
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
        run: npm run generate

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Veröffentlichungsdateien zusammenstellen
        shell: bash
        run: |
          mkdir -p _site/app _site/public _site/data
          cp index.html dashboard.css dashboard.js .nojekyll _site/
          cp app/globals.css _site/app/globals.css
          cp -r public/. _site/public/
          cp data/dashboard.json _site/data/dashboard.json

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
