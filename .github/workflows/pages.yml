name: Deploy Deadlock Dashboard to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Statische Ausgabe prüfen
        run: npm test

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Veröffentlichungsdateien zusammenstellen
        shell: bash
        run: |
          mkdir -p _site/app _site/public
          cp index.html dashboard.css .nojekyll _site/
          cp app/globals.css _site/app/globals.css
          cp public/favicon.svg _site/public/favicon.svg

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
